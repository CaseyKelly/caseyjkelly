<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="casey kelly-ajbani: senior software engineer in Denver">
  <defs>
    <linearGradient id="bg" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.5" stop-color="#18181f"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="indigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuchsia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#d4d4d8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4d4d8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d4d4d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c7d2fe" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="name-clip">
      <text x="600" y="190" text-anchor="middle" class="name">casey kelly-ajbani</text>
    </clipPath>
    <style>
      .name { font: 700 96px "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: -3px; }
      .mono { font: 400 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .star { fill: #fff; animation: twinkle 4s ease-in-out infinite; }
      .line { stroke: #a5b4fc; stroke-opacity: 0.22; stroke-width: 1; }
      .nebula { animation: drift 18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .sweep { animation: sweep 7s ease-in-out 1s infinite; }
      .spec { opacity: 0; animation: cycle 24s steps(1, end) infinite; }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      @keyframes drift { from { transform: translate(-30px, -10px) scale(1); } to { transform: translate(40px, 20px) scale(1.15); } }
      @keyframes sweep { 0% { transform: translateX(-700px); } 45%, 100% { transform: translateX(700px); } }
      @keyframes cycle { 0% { opacity: 1; } 12.5%, 100% { opacity: 0; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .star, .nebula, .sweep, .cursor { animation: none; }
        .spec { animation: none; }
        .spec:first-of-type { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse class="nebula" cx="420" cy="170" rx="380" ry="220" fill="url(#indigo)"/>
  <ellipse class="nebula" cx="900" cy="280" rx="320" ry="180" fill="url(#fuchsia)" style="animation-delay:-9s"/>

  <!-- constellations -->
  <g class="line">
    <polyline fill="none" points="60,60 130,40 175,95 120,130 60,60"/>
    <polyline fill="none" points="175,95 250,70"/>
    <polyline fill="none" points="980,50 1060,85 1130,40 1160,110"/>
    <polyline fill="none" points="1060,85 1040,150"/>
    <polyline fill="none" points="90,290 160,320 240,280"/>
    <polyline fill="none" points="1000,300 1080,270 1150,320"/>
    <polyline fill="none" points="760,40 820,25 870,60"/>
  </g>
  <g>
    <circle class="star" cx="60" cy="60" r="2"/>
    <circle class="star" cx="130" cy="40" r="1.6" style="animation-delay:-1s"/>
    <circle class="star" cx="175" cy="95" r="2.4" style="animation-delay:-2.5s"/>
    <circle class="star" cx="120" cy="130" r="1.5" style="animation-delay:-0.6s"/>
    <circle class="star" cx="250" cy="70" r="1.4" style="animation-delay:-3.2s"/>
    <circle class="star" cx="980" cy="50" r="1.6" style="animation-delay:-1.8s"/>
    <circle class="star" cx="1060" cy="85" r="2.4" style="animation-delay:-0.3s"/>
    <circle class="star" cx="1130" cy="40" r="1.5" style="animation-delay:-2.1s"/>
    <circle class="star" cx="1160" cy="110" r="1.8" style="animation-delay:-3.6s"/>
    <circle class="star" cx="1040" cy="150" r="1.4" style="animation-delay:-1.4s"/>
    <circle class="star" cx="90" cy="290" r="1.6" style="animation-delay:-2.8s"/>
    <circle class="star" cx="160" cy="320" r="2.2" style="animation-delay:-0.9s"/>
    <circle class="star" cx="240" cy="280" r="1.5" style="animation-delay:-3.9s"/>
    <circle class="star" cx="1000" cy="300" r="1.5" style="animation-delay:-1.1s"/>
    <circle class="star" cx="1080" cy="270" r="2.2" style="animation-delay:-2.4s"/>
    <circle class="star" cx="1150" cy="320" r="1.6" style="animation-delay:-0.2s"/>
    <circle class="star" cx="760" cy="40" r="1.4" style="animation-delay:-3s"/>
    <circle class="star" cx="820" cy="25" r="1.9" style="animation-delay:-1.6s"/>
    <circle class="star" cx="870" cy="60" r="1.4" style="animation-delay:-2.2s"/>
    <circle class="star" cx="340" cy="30" r="1" style="animation-delay:-0.5s"/>
    <circle class="star" cx="520" cy="330" r="1.1" style="animation-delay:-2.7s"/>
    <circle class="star" cx="690" cy="315" r="0.9" style="animation-delay:-1.3s"/>
    <circle class="star" cx="420" cy="290" r="1" style="animation-delay:-3.4s"/>
    <circle class="star" cx="610" cy="45" r="1" style="animation-delay:-0.8s"/>
    <circle class="star" cx="300" cy="200" r="0.9" style="animation-delay:-2s"/>
    <circle class="star" cx="930" cy="190" r="1" style="animation-delay:-3.7s"/>
  </g>

  <rect x="0" y="92" width="1200" height="1" fill="url(#rule)"/>
  <rect x="0" y="282" width="1200" height="1" fill="url(#rule)"/>

  <text x="600" y="190" text-anchor="middle" class="name" fill="#fff">casey kelly-ajbani</text>
  <g clip-path="url(#name-clip)">
    <rect class="sweep" x="300" y="100" width="600" height="110" fill="url(#shine)"/>
  </g>

  <g class="mono">
    <text x="290" y="246" xml:space="preserve"><tspan fill="#a5b4fc">~/denver</tspan><tspan fill="#71717a"> $ </tspan><tspan fill="#a1a1aa">building</tspan></text>
    <g fill="#fff">
      <text class="spec" x="556" y="246">accessible interfaces<tspan class="cursor" fill="#a5b4fc">▌</tspan></text>
      <text class="spec" x="556" y="246" style="animation-delay:3s">reliable backend services<tspan class="cursor" fill="#a5b4fc">▌</tspan></text>
      <text class="spec" x="556" y="246" style="animation-delay:6s">design systems<tspan class="cursor" fill="#a5b4fc">▌</tspan></text>
      <text class="spec" x="556" y="246" style="animation-delay:9s">secure payment flows<tspan class="cursor" fill="#a5b4fc">▌</tspan></text>
      <text class="spec" x="556" y="246" style="animation-delay:12s">features end to end<tspan class="cursor" fill="#a5b4fc">▌</tspan></text>
      <text class="spec" x="556" y="246" style="animation-delay:15s">cloud infrastructure as code<tspan class="cursor" fill="#a5b4fc">▌</tspan></text>
      <text class="spec" x="556" y="246" style="animation-delay:18s">delightful micro-interactions<tspan class="cursor" fill="#a5b4fc">▌</tspan></text>
      <text class="spec" x="556" y="246" style="animation-delay:21s">fast, resilient frontends<tspan class="cursor" fill="#a5b4fc">▌</tspan></text>
    </g>
  </g>
</svg>
